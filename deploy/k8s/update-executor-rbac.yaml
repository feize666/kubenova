apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubenova-update-executor
  namespace: kubenova
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubenova-update-executor
  namespace: kubenova
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["control-api", "runtime-gateway", "frontend"]
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubenova-update-executor
  namespace: kubenova
subjects:
  - kind: ServiceAccount
    name: kubenova-update-executor
    namespace: kubenova
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubenova-update-executor
